[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssdwtf"
version = "0.1.0"
description = "Monitor, clean, alert and optimize a Mac drowning in agentic-IDE state"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
ssdwtf = "ssdwtf.cli:main"

[tool.setuptools.packages.find]
include = ["ssdwtf*"]
